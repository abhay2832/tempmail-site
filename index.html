<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Temp Mail</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { margin-top: 0; color: #1a73e8; }
        p.subtitle { color: #555; margin-bottom: 20px; }
        
        .email-display {
            background: #f8f9fa;
            border: 2px dashed #1a73e8;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            border-radius: 8px;
            margin-bottom: 20px;
            word-break: break-all;
            user-select: all;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-new { background-color: #28a745; color: white; }
        .btn-new:hover { background-color: #218838; }
        .btn-refresh { background-color: #1a73e8; color: white; }
        .btn-refresh:hover { background-color: #155db1; }
        
        .inbox-container {
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .inbox-container h3 { margin-top: 0; }
        
        .message-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .message-item {
            background: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .message-item:hover { background: #eef2f5; }
        .msg-sender { font-weight: bold; font-size: 14px; color: #1a73e8; }
        .msg-subject { font-size: 16px; margin: 5px 0; }
        .msg-date { font-size: 12px; color: #777; }
        
        .message-body {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 15px;
            color: #222;
        }
        
        .loading { font-size: 14px; color: #666; font-style: italic; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Temp Mail</h1>
    <p class="subtitle">Aapka temporary, real-looking email address</p>

    <div class="email-display" id="email-address">Loading...</div>

    <div class="controls">
        <button class="btn-new" onclick="generateNewEmail()">+ New Email</button>
        <button class="btn-refresh" onclick="checkInbox()">⟳ Refresh Inbox</button>
    </div>

    <div class="inbox-container">
        <h3>Inbox <span id="loading-text" class="loading">(Checking...)</span></h3>
        <ul class="message-list" id="inbox-list">
            <li class="message-item" style="text-align:center; color: #888;">Inbox is empty. Waiting for OTPs...</li>
        </ul>
    </div>
</div>

<script>
    let currentEmail = "";
    let login = "";
    let domain = "";

    // Load saved email from local storage or generate a new one
    window.onload = function() {
        const savedEmail = localStorage.getItem("tempEmail");
        if (savedEmail) {
            currentEmail = savedEmail;
            extractCredentials(currentEmail);
            document.getElementById("email-address").innerText = currentEmail;
            checkInbox();
        } else {
            generateNewEmail();
        }
    };

    function extractCredentials(email) {
        let parts = email.split("@");
        login = parts[0];
        domain = parts[1];
    }

    async function generateNewEmail() {
        document.getElementById("email-address").innerText = "Generating...";
        try {
            let response = await fetch("https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1");
            let data = await response.json();
            currentEmail = data[0];
            
            extractCredentials(currentEmail);
            localStorage.setItem("tempEmail", currentEmail);
            
            document.getElementById("email-address").innerText = currentEmail;
            document.getElementById("inbox-list").innerHTML = '<li class="message-item" style="text-align:center; color: #888;">Inbox is empty. Waiting for OTPs...</li>';
        } catch (error) {
            document.getElementById("email-address").innerText = "Error generating email!";
        }
    }

    async function checkInbox() {
        if (!login || !domain) return;
        
        const loadingText = document.getElementById("loading-text");
        loadingText.style.display = "inline";

        try {
            let response = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${login}&domain=${domain}`);
            let messages = await response.json();
            
            const inboxList = document.getElementById("inbox-list");
            inboxList.innerHTML = "";

            if (messages.length === 0) {
                inboxList.innerHTML = '<li class="message-item" style="text-align:center; color: #888;">Inbox is empty. Waiting for OTPs...</li>';
            } else {
                messages.forEach(msg => {
                    let li = document.createElement("li");
                    li.className = "message-item";
                    li.innerHTML = `
                        <div class="msg-sender">From: ${msg.from}</div>
                        <div class="msg-subject">${msg.subject}</div>
                        <div class="msg-date">${msg.date}</div>
                        <div class="message-body" id="body-${msg.id}">Fetching content...</div>
                    `;
                    // Fetch full message when clicked
                    li.onclick = () => fetchMessageContent(msg.id);
                    inboxList.appendChild(li);
                });
            }
        } catch (error) {
            console.error("Error fetching inbox", error);
        } finally {
            loadingText.style.display = "none";
        }
    }

    async function fetchMessageContent(id) {
        let bodyDiv = document.getElementById(`body-${id}`);
        
        // Toggle visibility if already fetched
        if (bodyDiv.style.display === "block") {
            bodyDiv.style.display = "none";
            return;
        }

        try {
            let response = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${login}&domain=${domain}&id=${id}`);
            let data = await response.json();
            
            // Render HTML if available, else text body
            bodyDiv.innerHTML = data.htmlBody ? data.htmlBody : data.textBody;
            bodyDiv.style.display = "block";
        } catch (error) {
            bodyDiv.innerHTML = "Error loading message.";
            bodyDiv.style.display = "block";
        }
    }

    // Auto-refresh every 10 seconds
    setInterval(checkInbox, 10000);
</script>

</body>
</html>
